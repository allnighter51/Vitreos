[package]
name = "vitreos-pulse"
version = "1.0.0"
edition = "2021"

[lib]
name = "vitreos_pulse"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
sysinfo = "0.29.11"
nvml-wrapper = "0.10"
parking_lot = "0.12"
once_cell = "1.19"
windows = { version = "0.52", features = [
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Wmi",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 2
